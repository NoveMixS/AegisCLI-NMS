<svg width="220" height="240" viewBox="0 0 220 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="shieldSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f7fa"/>
      <stop offset="45%" stop-color="#c8d2dc"/>
      <stop offset="100%" stop-color="#7c8a99"/>
    </linearGradient>
    <linearGradient id="shieldBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fa8ff"/>
      <stop offset="55%" stop-color="#1462c9"/>
      <stop offset="100%" stop-color="#062a63"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#b9c4cf"/>
      <stop offset="100%" stop-color="#5c6b7a"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fa8ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9fd0ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4fa8ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="shieldClip">
      <path d="M110 24 L174 47 C174 98 164 142 110 186 C56 142 46 98 46 47 Z"/>
    </clipPath>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0a1d3d" flood-opacity="0.35"/>
    </filter>
    <style>
      .float  { animation: float 3.6s ease-in-out infinite; }
      .glow   { animation: glow 2.4s ease-in-out infinite; transform-origin: 110px 110px; }
      .ring   { animation: spin 14s linear infinite; transform-origin: 110px 110px; }
      .blade  { animation: shine 3s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes glow  { 0%,100% { opacity: .25; transform: scale(.96); } 50% { opacity: .7; transform: scale(1.04); } }
      @keyframes spin  { to { transform: rotate(360deg); } }
      @keyframes shine { 0%,100% { opacity: .85; } 50% { opacity: 1; } }
    </style>
  </defs>

  <!-- pulsing aura -->
  <circle class="glow" cx="110" cy="110" r="98" fill="none" stroke="#4fa8ff" stroke-width="2"/>

  <!-- rotating dashed ring -->
  <circle class="ring" cx="110" cy="110" r="104" fill="none" stroke="#4fa8ff"
          stroke-width="1.5" stroke-dasharray="6 10" opacity="0.6"/>

  <g class="float">
    <g filter="url(#softShadow)">
      <path d="M110 12 L188 40 C188 100 176 150 110 200 C44 150 32 100 32 40 Z"
            fill="url(#shieldSteel)" stroke="#3a4652" stroke-width="2"/>
      <path d="M110 24 L174 47 C174 98 164 142 110 186 C56 142 46 98 46 47 Z"
            fill="url(#shieldBlue)"/>
      <path d="M110 24 L174 47 C174 98 164 142 110 186 Z" fill="#ffffff" opacity="0.06"/>
    </g>

    <!-- scanning line inside shield -->
    <g clip-path="url(#shieldClip)">
      <rect x="40" y="-30" width="140" height="30" fill="url(#scan)">
        <animate attributeName="y" values="10;170;10" dur="3.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g class="blade" filter="url(#softShadow)">
      <rect x="104" y="28" width="12" height="92" rx="3" fill="url(#bladeGrad)"/>
      <path d="M110 20 L124 34 L110 44 L96 34 Z" fill="url(#bladeGrad)"/>
      <rect x="86" y="100" width="48" height="10" rx="2" fill="#dfe6ec"/>
      <rect x="100" y="108" width="20" height="46" rx="4" fill="#1c2733"/>
      <rect x="107" y="108" width="6" height="46" fill="#4fa8ff" opacity="0.7"/>
    </g>
  </g>
</svg>
