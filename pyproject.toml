# =====================================================================
#  AegisCLI — pyproject.toml
#  Modern PEP 621 / PEP 517 build configuration.
# =====================================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


# ---------------------------------------------------------------------
#  Project metadata
# ---------------------------------------------------------------------
[project]
name = "aegiscli"
version = "0.1.0"
description = "All-in-One Modular Security CLI Toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Md Siyam Mahmud", email = "novemixs@gmail.com" },
]
maintainers = [
    { name = "NMS (Novemixs Security)", email = "novemixs@gmail.com" },
]
keywords = [
    "security",
    "cli",
    "cybersecurity",
    "pentest",
    "recon",
    "nmap",
    "subdomain",
    "hash",
    "audit",
    "toolkit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
    "Typing :: Typed",
]

# Runtime dependencies
dependencies = [
    "rich>=13.7.0,<15.0.0",
    "cryptography>=42.0.0,<46.0.0",
    "prompt-toolkit>=3.0.43,<4.0.0",
]

# Optional dependency groups:  pip install aegiscli[dev]
[project.optional-dependencies]
dev = [
    "ruff>=0.6.0,<1.0.0",
    "black>=24.8.0,<25.0.0",
    "mypy>=1.11.0,<2.0.0",
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "pre-commit>=3.8.0,<4.0.0",
    "bandit>=1.7.9,<2.0.0",
    "pip-audit>=2.7.0,<3.0.0",
]
ai = [
    "langchain>=0.3.0,<1.0.0",
    "langchain-community>=0.3.0,<1.0.0",
    "ollama>=0.4.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]
all = [
    "aegiscli[dev,ai]",
]

# Project URLs shown on PyPI
[project.urls]
Homepage        = "https://github.com/novemixs/AegisCLI-NMS"
Repository      = "https://github.com/novemixs/AegisCLI-NMS"
Issues          = "https://github.com/novemixs/AegisCLI-NMS/issues"
Discussions     = "https://github.com/novemixs/AegisCLI-NMS/discussions"
Changelog       = "https://github.com/novemixs/AegisCLI-NMS/blob/main/CHANGELOG.md"
Documentation   = "https://github.com/novemixs/AegisCLI-NMS/blob/main/README.md"
Legal           = "https://github.com/novemixs/AegisCLI-NMS/blob/main/LEGAL.md"
"Bug Tracker"   = "https://github.com/novemixs/AegisCLI-NMS/issues"


# ---------------------------------------------------------------------
#  Entry points — this is what makes `aegis` a command
# ---------------------------------------------------------------------
[project.scripts]
aegis = "aegis_cli.__main__:main"


# ---------------------------------------------------------------------
#  Setuptools: what to include in the wheel
# ---------------------------------------------------------------------
[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis_cli*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
aegis_cli = [
    "tools/*.py",
    "data/*.txt",
    "data/*.json",
    "py.typed",
]


# ---------------------------------------------------------------------
#  Black — code formatter
# ---------------------------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | \.venv
  | build
  | dist
)/
'''


# ---------------------------------------------------------------------
#  Ruff — linter
# ---------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit (security)
]
ignore = [
    "E501",   # line too long — Black handles it
    "S101",   # assert — needed in tests
    "S603",   # subprocess without shell=True — fine here
    "S607",   # partial executable path — fine here
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"tools/*.py" = ["S101"]


# ---------------------------------------------------------------------
#  Mypy — static type checker
# ---------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unreachable = true
ignore_missing_imports = true
exclude = [
    "build/",
    "dist/",
    "\.venv/",
]


# ---------------------------------------------------------------------
#  Pytest
# ---------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=aegis_cli",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests that require network access",
    "integration: marks integration tests",
]


# ---------------------------------------------------------------------
#  Coverage
# ---------------------------------------------------------------------
[tool.coverage.run]
source = ["aegis_cli"]
branch = true
omit = [
    "*/tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]


# ---------------------------------------------------------------------
#  Bandit — security linter
# ---------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips = ["B101", "B603", "B607"]


# ---------------------------------------------------------------------
#  pyproject-fmt / general tooling hints
# ---------------------------------------------------------------------
[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["aegis_cli"]
